<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorial — Filipe Martins Assink</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    background:#f4f0eb;
    color:#443b35;
    line-height:1.8;
}

header{
    min-height:85vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(rgba(30,25,20,.55),rgba(30,25,20,.55)),
    url("1000118481.jpg") center/cover;
    color:white;
}

.capa{
    max-width:850px;
}

.capa h1{
    font-size:clamp(38px,8vw,72px);
    margin:0 0 10px;
}

.capa p{
    font-size:clamp(18px,4vw,27px);
    font-style:italic;
}

nav{
    position:sticky;
    top:0;
    z-index:10;
    background:#332d29;
    text-align:center;
    padding:12px 5px;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin:0 12px;
    font-size:15px;
}

main{
    max-width:950px;
    margin:auto;
    padding:45px 18px;
}

section{
    background:#fffdf9;
    margin-bottom:30px;
    padding:35px;
    border-radius:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    color:#69584c;
    font-size:32px;
    margin-top:0;
}

p{
    font-size:18px;
}

.destaque{
    text-align:center;
    font-size:24px;
    font-style:italic;
    padding:25px;
    color:#756458;
}

.foto-principal{
    width:100%;
    max-height:700px;
    object-fit:cover;
    border-radius:18px;
    display:block;
    margin:25px auto;
}

.galeria{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.galeria img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:15px;
    cursor:pointer;
    transition:.3s;
}

.galeria img:hover{
    transform:scale(1.02);
}

.video{
    width:100%;
    border-radius:18px;
    display:block;
    background:#111;
}

.mensagem{
    text-align:center;
    font-size:22px;
    font-style:italic;
}

footer{
    text-align:center;
    padding:35px 15px;
    color:#756a62;
}

@media(max-width:600px){
    section{
        padding:25px 18px;
    }

    nav a{
        margin:0 5px;
