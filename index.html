<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memorial Felipe Martins Assink</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f4f0eb;
    color: #3d3834;
    line-height: 1.7;
}

header {
    min-height: 100vh;
    background: linear-gradient(
        rgba(30,25,22,0.55),
        rgba(30,25,22,0.65)
    ),
    url("foto-principal.jpg") center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 30px;
}

.capa {
    max-width: 700px;
}

.capa h1 {
    font-size: 48px;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

.capa p {
    font-size: 21px;
    font-style: italic;
}

.data {
    margin-top: 25px;
    font-size: 18px;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

section {
    background: white;
    margin-bottom: 35px;
    padding: 35px 28px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    color: #6d5748;
    margin-bottom: 25px;
    font-size: 30px;
}

p {
    margin-bottom: 15px;
}

.destaque {
    text-align: center;
    font-size: 21px;
    font-style: italic;
    color: #765f50;
    margin: 25px 0;
}

.linha {
    border-left: 3px solid #b59b87;
    padding-left: 20px;
}

.linha div {
    margin-bottom: 25px;
}

.linha strong {
    color: #6d5748;
}

.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.galeria img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
}

.mensagem {
    text-align: center;
    font-size: 20px;
}

footer {
    text-align: center;
    padding: 35px 20px;
    background: #3d3834;
    color: white;
    font-size: 14px;
}

@media (max-width: 600px) {
    .capa h1 {
        font-size: 36px;
    }

    .capa p {
        font-size: 18px;
    }

    section {
        padding: 25px 20px;
    }

    h2 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="capa">
        <h1>Felipe Martins Assink</h1>

        <p>
            Uma vida que deixou marcas, histórias,
            amor e saudades.
        </p>

        <div class="data">
            02 de agosto de 1991<br>
            ✦<br>
            19 de junho de 2025
        </div>
    </div>
</header>

<main>

<section>
    <h2>Em memória</h2>

    <p>
